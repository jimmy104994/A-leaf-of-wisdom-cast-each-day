<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日奉一箋，邂逅今朝之啟迪</title>
  <!-- 載入 Tailwind CSS 與 Google Noto Serif 字型增添木質溫潤感 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Zen Maru Gothic', 'Noto Serif TC', serif;
      background: radial-gradient(circle at 50% 20%, #F5EFEB 0%, #E8DFD8 60%, #D8CFC8 100%);
      -webkit-tap-highlight-color: transparent;
    }

    /* 木質紋理與溫暖陰影 */
    .wood-card {
      background: linear-gradient(145deg, #7A5643, #5A3D2E);
      box-shadow: 0 16px 36px -8px rgba(58, 38, 28, 0.45),
                  inset 0 1px 1px rgba(255, 255, 255, 0.25),
                  inset 0 -2px 4px rgba(0, 0, 0, 0.4);
    }

    .paper-card {
      background: #FAF7F2;
      background-image: radial-gradient(#E8DFC8 0.75px, transparent 0.75px);
      background-size: 16px 16px;
      box-shadow: 0 20px 40px -10px rgba(78, 52, 38, 0.2), 0 0 0 1px rgba(140, 110, 90, 0.15);
    }

    /* 抽籤時的呼吸與晃動動畫 */
    @keyframes wood-shake {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      20% { transform: translateY(-4px) rotate(-2deg); }
      40% { transform: translateY(2px) rotate(2deg); }
      60% { transform: translateY(-3px) rotate(-1.5deg); }
      80% { transform: translateY(1px) rotate(1deg); }
    }

    @keyframes golden-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(230, 175, 90, 0.3); }
      50% { box-shadow: 0 0 32px rgba(245, 205, 120, 0.85); }
    }

    .anim-shake {
      animation: wood-shake 0.5s ease-in-out infinite, golden-glow 1.2s ease-in-out infinite;
    }

    /* 柔順的翻轉效果 */
    .card-perspective {
      perspective: 1200px;
    }

    .card-inner {
      transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }

    .flipped {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body class="min-h-screen text-[#4A3B32] flex flex-col justify-between items-center p-4 selection:bg-[#D7CCC8]">

  <!-- 頂部標頭與測試開關 -->
  <header class="w-full max-w-md pt-4 pb-2 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="text-2xl">🍵</span>
      <div>
        <h1 class="text-lg font-bold tracking-wider text-[#5D4037]">心境晨光</h1>
        <p class="text-xs text-[#8D6E63]" id="todayDateText">今日好日</p>
      </div>
    </div>

    <!-- 再次抽取 / 重置按鈕（方便親友隨時體驗） -->
    <button id="resetBtn" title="重新抽取另一張" class="text-xs px-2.5 py-1.5 rounded-full border border-[#BCAAA4] text-[#795548] hover:bg-[#EFEBE9] transition active:scale-95 flex items-center gap-1 shadow-sm">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      <span>再抽一次</span>
    </button>
  </header>

  <!-- 主要互動抽籤區 -->
  <main class="w-full max-w-sm my-auto card-perspective py-4 flex flex-col items-center">
    <div id="cardContainer" class="card-inner relative w-full min-h-[460px]">
      
      <!-- 卡片正面：木質御守籤盒（未抽取時） -->
      <div id="cardFront" class="card-front absolute inset-0 wood-card rounded-3xl p-6 text-white flex flex-col justify-between items-center border border-[#9C7A65] cursor-pointer shadow-xl select-none">
        <!-- 頂部木飾與紅繩結 -->
        <div class="w-full flex justify-center pt-2">
          <div class="w-12 h-12 rounded-full border-2 border-[#D7CCC8]/40 flex items-center justify-center bg-black/15 shadow-inner">
            <span class="text-xl">🎋</span>
          </div>
        </div>

        <!-- 中間引導文字 -->
        <div class="text-center my-auto space-y-3">
          <div class="inline-block px-3 py-1 rounded-full bg-white/10 text-xs tracking-widest text-[#EFEBE9] border border-white/15">
            日日是好日
          </div>
          <h2 class="text-2xl font-bold tracking-widest text-[#FFF8E7] drop-shadow-sm font-['Noto_Serif_TC']">
            點擊開啟今日籤文
          </h2>
          <p class="text-xs text-[#D7CCC8] leading-relaxed max-w-[210px] mx-auto opacity-90">
            靜下心呼吸三次<br>讓今天的專屬智慧指引你的步伐
          </p>
        </div>

        <!-- 底部互動指引按鈕 -->
        <div class="w-full pb-3 flex justify-center">
          <div class="px-6 py-2.5 rounded-full bg-gradient-to-r from-[#D7CCC8] to-[#EFEBE9] text-[#4E342E] font-bold text-sm tracking-wider shadow-md flex items-center gap-2 transform transition hover:scale-105 active:scale-95">
            <span class="animate-pulse">✨</span>
            <span id="promptBtnText">輕觸抽籤</span>
          </div>
        </div>
      </div>

      <!-- 卡片背面：和紙金句成果（抽取後展示） -->
      <div id="cardBack" class="card-back absolute inset-0 paper-card rounded-3xl p-6 text-[#3E2723] flex flex-col justify-between border-2 border-[#E0D7D0] shadow-xl">
        
        <!-- 卡片上方：類別標籤與印章風格 -->
        <div class="flex justify-between items-center border-b border-[#E8DFC8] pb-3">
          <div class="flex items-center gap-1.5 text-xs font-semibold text-[#8D6E63] tracking-widest">
            <span class="text-base" id="quoteIcon">🌱</span>
            <span id="quoteCategory">心靈安放</span>
          </div>
          <div class="text-[10px] px-2 py-0.5 rounded border border-[#C7A280] text-[#A16848] font-bold tracking-widest">
            本日籤示
          </div>
        </div>

        <!-- 中間：核心好懂金句與啟發 -->
        <div class="my-auto py-2 flex flex-col justify-center">
          <!-- 哲理金句 -->
          <blockquote class="text-xl sm:text-2xl font-black text-[#3E2723] leading-relaxed tracking-wide font-['Noto_Serif_TC'] text-center">
            「<span id="quoteText">慢慢走，沿途的花才會開進你心裡。</span>」
          </blockquote>

          <div class="w-8 h-[2px] bg-[#C8B6A6] mx-auto my-4 rounded-full"></div>

          <!-- 生活小啟發（好懂、能馬上落實） -->
          <div class="bg-[#F3EDE5]/80 p-3.5 rounded-2xl border border-[#E8DFC8]/70">
            <div class="flex items-center gap-1.5 text-xs font-bold text-[#6D4C41] mb-1">
              <span>💡</span> 生活微啟發：
            </div>
            <p id="quoteInsight" class="text-xs text-[#5D4037] leading-relaxed">
              今天試著放慢喝一杯水或走路的步調，把注意力留給身邊微小但可愛的細節。
            </p>
          </div>
        </div>

        <!-- 底部互動按鈕區：複製與 LINE 轉發 -->
        <div class="pt-3 border-t border-[#E8DFC8] space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <!-- 複製金句 -->
            <button id="copyBtn" class="w-full py-2.5 px-3 rounded-xl bg-[#EFEBE9] hover:bg-[#E0D7D0] text-[#4E342E] text-xs font-bold transition flex items-center justify-center gap-1.5 active:scale-95 border border-[#D7CCC8]">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#6D4C41]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
              </svg>
              <span id="copyBtnText">複製金句</span>
            </button>

            <!-- 分享回 LINE 給朋友 -->
            <button id="shareLineBtn" class="w-full py-2.5 px-3 rounded-xl bg-[#06C755] hover:bg-[#05b34c] text-white text-xs font-bold transition flex items-center justify-center gap-1.5 active:scale-95 shadow-sm">
              <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.084.495.234l2.46 3.337v-2.94c0-.348.279-.63.63-.63.346 0 .626.282.626.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
              </svg>
              <span>送給好友</span>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- 底部輕提示 -->
    <p class="text-[11px] text-[#8D6E63] mt-4 flex items-center gap-1 opacity-80">
      <span>🌿</span> 每一句話，都是生活贈予的微光
    </p>
  </main>

  <!-- 提示浮動框 (Toast，取代 alert 提升手機質感) -->
  <div id="toast" class="fixed bottom-6 bg-[#3E2723]/90 backdrop-blur-sm text-[#F5EFEB] text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3">
    提示訊息
  </div>

  <footer class="w-full text-center py-2 text-[10px] text-[#A1887F]">
    今日智慧 ‧ 溫暖相伴
  </footer>

  <script>
    // 智慧金句庫：白話好懂、溫暖有啟發
    const quotes = [
      {
        text: "慢慢走，沿途的花才會開進心裡。",
        insight: "今天試著放慢吃飯或喝水的節奏，留三分鐘給自己靜靜發呆。",
        category: "生活節奏",
        icon: "🌸"
      },
      {
        text: "允許自己偶爾像雲一樣，只是飄著，不急著去哪裡。",
        insight: "不必每一刻都充滿生產力，好好放鬆也是一種前進的累積。",
        category: "寬待自己",
        icon: "☁️"
      },
      {
        text: "做一個溫暖的人，先從溫柔對待自己的不完美開始。",
        insight: "今天若有不如意的事，對自己說一聲：「沒關係，我已經很棒了。」",
        category: "自我接納",
        icon: "🍵"
      },
      {
        text: "幸福不是擁有的多，而是能感知細小美好的能力在身邊。",
        insight: "抬頭看看今天的微風、天空或身邊人的微笑，那都是生活給的禮物。",
        category: "感知幸福",
        icon: "🍃"
      },
      {
        text: "不必和別人走一樣的時區，每朵花都有屬於它綻放的季節。",
        insight: "不用羨慕別人的進度，踏實走好屬於自己的當下每一步。",
        category: "專注自處",
        icon: "🌻"
      },
      {
        text: "把心放寬一點，煩惱自然就找不到停留的縫隙。",
        insight: "遇到棘手的事時深呼吸三次，先把情緒放下，事情往往比想像簡單。",
        category: "心靈豁達",
        icon: "🌊"
      },
      {
        text: "心裡有光的人，走到哪裡都能看見明亮。",
        insight: "今天主動給身邊的一位朋友或店員一個真誠的感謝與微笑吧。",
        category: "傳遞溫暖",
        icon: "☀️"
      },
      {
        text: "所有的沉澱，都是為了日後更有力量的向上生長。",
        insight: "感到停滯不前時，其實正是扎根最深的時候，相信自己的累積。",
        category: "堅持勇氣",
        icon: "🌱"
      },
      {
        text: "簡化身邊的事物，騰出空間給真正讓你心動的美好。",
        insight: "整理一下書桌或手機相簿，心靈的清爽往往從隨手整理開始。",
        category: "極簡自在",
        icon: "🪴"
      },
      {
        text: "每一次勇敢的開始，都比停留在腦海裡的完美更有力量。",
        insight: "想做的那件小事，今天就踏出第一小步，五分鐘就好。",
        category: "行動契機",
        icon: "🚀"
      },
      {
        text: "善良是一盞燈，照亮別人的同時，也溫暖了自己回家的路。",
        insight: "一句順口說出的鼓勵，可能正是別人度過艱難時刻的力量來源。",
        category: "善意相伴",
        icon: "🕯️"
      },
      {
        text: "昨天的雨已經停了，別讓它淋濕今天的陽光。",
        insight: "過去的事情已經過去，翻開新的一頁，今天又是全新的一天。",
        category: "釋懷釋然",
        icon: "🌈"
      }
    ];

    // DOM 元素
    const cardContainer = document.getElementById('cardContainer');
    const cardFront = document.getElementById('cardFront');
    const cardBack = document.getElementById('cardBack');
    const quoteText = document.getElementById('quoteText');
    const quoteInsight = document.getElementById('quoteInsight');
    const quoteCategory = document.getElementById('quoteCategory');
    const quoteIcon = document.getElementById('quoteIcon');
    const promptBtnText = document.getElementById('promptBtnText');
    const todayDateText = document.getElementById('todayDateText');
    const resetBtn = document.getElementById('resetBtn');
    const copyBtn = document.getElementById('copyBtn');
    const copyBtnText = document.getElementById('copyBtnText');
    const shareLineBtn = document.getElementById('shareLineBtn');
    const toast = document.getElementById('toast');

    // 取得今日 YYYY-MM-DD 格式
    function getTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // 格式化顯示頂部日期
    function displayTodayDate() {
      const now = new Date();
      const weekdays = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
      const m = now.getMonth() + 1;
      const d = now.getDate();
      const day = weekdays[now.getDay()];
      todayDateText.textContent = `${m}月${d}日 ${day} ‧ 專屬箴言`;
    }

    // 氣泡提示訊息 (取代 alert)
    let toastTimer = null;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
      }, 2300);
    }

    // 渲染金句到卡片背面
    function renderQuote(quoteData) {
      quoteText.textContent = quoteData.text;
      quoteInsight.textContent = quoteData.insight;
      quoteCategory.textContent = quoteData.category;
      quoteIcon.textContent = quoteData.icon;
    }

    // 依據字串產生固定的偽隨機索引（確保同一天抽出的結果具有穩定性）
    function getDeterministicQuoteIndex(seedStr) {
      let hash = 0;
      for (let i = 0; i < seedStr.length; i++) {
        hash = (hash << 5) - hash + seedStr.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash) % quotes.length;
    }

    // 執行抽籤開牌動作
    function triggerDraw(isAutoRestore = false) {
      const todayStr = getTodayString();
      const savedDate = localStorage.getItem('wisdom_draw_date');
      let quoteIndex;

      if (savedDate === todayStr && localStorage.getItem('wisdom_quote_index') !== null) {
        quoteIndex = parseInt(localStorage.getItem('wisdom_quote_index'), 10);
      } else {
        quoteIndex = getDeterministicQuoteIndex(todayStr + "_" + Math.floor(Math.random() * 100));
        localStorage.setItem('wisdom_draw_date', todayStr);
        localStorage.setItem('wisdom_quote_index', quoteIndex);
      }

      const selectedQuote = quotes[quoteIndex] || quotes[0];
      renderQuote(selectedQuote);

      if (isAutoRestore) {
        // 若當天已抽過，直接顯示結果
        cardContainer.classList.add('flipped');
        return;
      }

      // 增強儀式感：先晃動籤木盒，產生金光，隨後優雅翻轉
      cardFront.classList.add('anim-shake');
      promptBtnText.textContent = "正在聆聽智慧...";

      setTimeout(() => {
        cardFront.classList.remove('anim-shake');
        cardContainer.classList.add('flipped');
        promptBtnText.textContent = "輕觸抽籤";
      }, 850);
    }

    // 重新抽取（測試或自由抽取）
    function resetAndDraw() {
      // 隨機選一個非當前的金句
      const currentIndex = parseInt(localStorage.getItem('wisdom_quote_index') || '0', 10);
      let newIndex = Math.floor(Math.random() * quotes.length);
      if (quotes.length > 1 && newIndex === currentIndex) {
        newIndex = (newIndex + 1) % quotes.length;
      }

      // 先翻回正面
      cardContainer.classList.remove('flipped');
      setTimeout(() => {
        localStorage.setItem('wisdom_draw_date', getTodayString());
        localStorage.setItem('wisdom_quote_index', newIndex);
        triggerDraw(false);
      }, 350);
    }

    // 初始化狀態
    function init() {
      displayTodayDate();
      const todayStr = getTodayString();
      const savedDate = localStorage.getItem('wisdom_draw_date');

      // 檢查今天是否已經抽過
      if (savedDate === todayStr && localStorage.getItem('wisdom_quote_index') !== null) {
        // 當日已抽過，自動展示今日卡片
        triggerDraw(true);
      }

      // 點擊卡片正面時抽籤
      cardFront.addEventListener('click', () => {
        if (!cardContainer.classList.contains('flipped')) {
          triggerDraw(false);
        }
      });

      // 重新抽取按鈕
      resetBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        resetAndDraw();
        showToast("已為您揭開另一份智慧箴言 🍃");
      });

      // 一鍵複製金句
      copyBtn.addEventListener('click', () => {
        const textToCopy = `【今日智慧籤】\n「${quoteText.textContent}」\n\n💡 微啟發：${quoteInsight.textContent}\n— 願今天的你，被溫暖包裹。`;
        
        // 透過 textarea 確保在 LINE 等 webview 內具備最高相容性
        const textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        textArea.style.position = "fixed";
        textArea.style.top = "-9999px";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        
        try {
          const successful = document.execCommand('copy');
          if (successful) {
            copyBtnText.textContent = "已複製！";
            showToast("金句已複製，隨時可貼上分享 📋");
            setTimeout(() => { copyBtnText.textContent = "複製金句"; }, 2000);
          } else {
            showToast("請長按螢幕文字手動複製");
          }
        } catch (err) {
          showToast("複製失敗，請手動複製");
        }
        document.body.removeChild(textArea);
      });

      // 分享至 LINE
      shareLineBtn.addEventListener('click', () => {
        const currentUrl = window.location.href;
        const shareMsg = `【今日送你的智慧小籤】\n「${quoteText.textContent}」\n\n💡生活微啟發：${quoteInsight.textContent}\n\n👉 換你來抽一張今天的暖心籤：\n${currentUrl}`;
        
        // 透過 LINE URL Scheme 分享文字
        const lineUrl = `https://line.me/R/msg/text/?` + encodeURIComponent(shareMsg);
        window.open(lineUrl, '_blank');
      });
    }

    window.onload = init;
  </script>
</body>
</html>
